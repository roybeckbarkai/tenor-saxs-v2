[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenor-saxs"
version = "0.2.0"
description = "Python port and validation of the TENOR-SAXS variable-resolution scattering method"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Roy Beck" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "h5py>=3.10",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebook = ["ipywidgets>=8.0"]

[tool.setuptools.packages.find]
include = ["tenor_saxs*"]
